name: Canon reference QA
on:
  workflow_dispatch:
  push:
    paths: ['CANON/**', 'CHARACTERS/**', 'QA/**', '.github/workflows/canon-qa.yml']
  pull_request:
    paths: ['CANON/**', 'CHARACTERS/**', 'QA/**', '.github/workflows/canon-qa.yml']
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - run: python -m unittest discover -s QA -p 'test_*.py' -v
      - run: python QA/check_canon.py
